name: Manual Release Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history and tags for changelog generation

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Calculate Auto-Incremented Version & Fetch Changelog
      id: version_and_changelog
      run: |
        # 1. Base version from build.gradle.kts
        BASE_VERSION=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0"; fi

        # 2. Auto-increment versionCode and versionName using GitHub Run Number
        BUILD_NUMBER=${{ github.run_number }}
        VERSION_CODE=$BUILD_NUMBER
        VERSION_NAME="${BASE_VERSION}.${BUILD_NUMBER}"
        TAG_NAME="v${VERSION_NAME}"

        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

        # 3. Fetch Changelog since last tag or initial commit
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          echo "Generating changelog since tag: $PREV_TAG"
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)")
        else
          echo "No previous tags found. Generating full commit log."
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 10)
        fi

        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="* Maintenance updates and bug fixes."
        fi

        # Save multi-line changelog output safely
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Decode Keystore from Secret
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

    - name: Build Signed Release APK
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleRelease \
          -PversionCode=${{ steps.version_and_changelog.outputs.version_code }} \
          -PversionName=${{ steps.version_and_changelog.outputs.version_name }} \
          --stacktrace

    - name: Prepare APK Asset
      run: |
        mkdir -p release_assets
        cp app/build/outputs/apk/release/app-release.apk release_assets/NHFuel-v${{ steps.version_and_changelog.outputs.version_name }}.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version_and_changelog.outputs.tag_name }}
        name: NH Fuel ${{ steps.version_and_changelog.outputs.tag_name }}
        body: |
          ## What's Changed
          ${{ steps.version_and_changelog.outputs.changelog }}

          ---
          * **Version Code**: ${{ steps.version_and_changelog.outputs.version_code }}
          * **Version Name**: `${{ steps.version_and_changelog.outputs.version_name }}`
          * **Package Name**: `com.nh.fuel`
        files: release_assets/NHFuel-v${{ steps.version_and_changelog.outputs.version_name }}.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

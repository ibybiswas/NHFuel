# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Settings specified in this file will override any Gradle settings in the user home directory.

# Enable AndroidX and Jetpack Compose optimization
android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=false

# JVM configuration for Gradle runner
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# Enable parallel execution and caching for faster builds in GitHub Actions
org.gradle.parallel=true
org.gradle.caching=true
